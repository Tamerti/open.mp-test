name: Update SDK & Network

on:
  workflow_dispatch:

  push:
    branches:
      - "stable"


permissions:
  contents: write


jobs:

  update-sdk:

    runs-on: ubuntu-latest

    steps:

      - name: Clone SDK fork repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "Tamerti/open.mp-sdk-test"
          path: "SDK"
          ref: "master"
          submodules: recursive
          token: ${{ secrets.CI_TOKEN }}


      - name: Update SDK files from open.mp dev branch
        shell: bash
        run: |
          cd SDK

          git remote add upstream https://github.com/openmultiplayer/open.mp-sdk.git || true

          git fetch upstream

          git checkout master

          git rebase upstream/dev

          git push origin master



  update-network:

    runs-on: ubuntu-latest

    steps:

      - name: Clone open.mp Network repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "openmultiplayer/open.mp-network"
          path: "Network"
          ref: "master"
          submodules: recursive
          token: ${{ secrets.CI_TOKEN }}


      - name: Update Network files from dev branch
        shell: bash
        run: |
          cd Network

          git fetch origin

          git rebase origin/dev

          git push || true
